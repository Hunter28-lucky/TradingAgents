services:
  - type: web
    name: tradingagents-terminal
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: ZERODHA_ACCESS_TOKEN
        sync: false
